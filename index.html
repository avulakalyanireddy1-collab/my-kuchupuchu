<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Kuchupuchu 💗</title>

<style>
body {
  background-image: url('WhatsApp%20Image%202026-11-03%20at%204.34.17%20PM.jpeg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  font-family: Arial, sans-serif;
  text-align: center;
  padding-top: 100px;
  min-height: 100vh;
  color: white;
  text-shadow: 1px 1px 4px black;
}

.card {
  background: transparent;
  max-width: 400px;
  margin: auto;
  padding: 35px;
  border-radius: 25px;
  box-shadow: none;
}

h1, h2, p {
  color: white;
  text-shadow: 2px 2px 5px black;
}

input, button {
  padding: 13px;
  border-radius: 12px;
  margin: 10px;
}

input {
  border: 1px solid #b5cce5;
}

button {
  background: #83acd5;
  color: white;
  border: none;
  cursor: pointer;
}

#message {
  color: pink;
}
</style>
</head>

<body>

<div class="card">
  <h1>🔐 A Little Surprise!</h1>
  <h2>Hey Kuchupuchu 💗</h2>
  <p>This little world is only for you!</p>
  <p>Enter our secret password</p>

  <input type="password" id="pass"
  placeholder="Enter password">

  <br>

  <button onclick="unlock()">
    UNLOCK MY SURPRISE 💕
  </button>

  <p id="message"></p>
</div>

<script>
function unlock() {
  let password = document.getElementById("pass").value;

  if (password === "chinni5") {
    document.getElementById("message").innerHTML =
    "Yayyy! Welcome Kuchupuchu! 🥹💗";
  } else {
    document.getElementById("message").innerHTML =
    "Oops! Wrong password. Try again 🙈";
  }
}
</script>

</body>
</html>
